<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 20" width="128" height="160" shape-rendering="crispEdges">
  <title>PocketBit</title>
  <!-- body -->
  <rect x="2" y="0" width="12" height="1" fill="#2b2a3d"/>
  <rect x="1" y="1" width="14" height="18" fill="#2b2a3d"/>
  <rect x="2" y="19" width="12" height="1" fill="#2b2a3d"/>
  <rect x="2" y="1" width="12" height="17" fill="#f2e6c9"/>
  <rect x="2" y="17" width="12" height="1" fill="#d8c9a6"/>
  <!-- screen bezel + screen -->
  <rect x="3" y="2" width="10" height="8" fill="#3b3a52"/>
  <rect x="4" y="3" width="8" height="6" fill="#4aa3df"/>
  <rect x="4" y="7" width="8" height="2" fill="#8a4b38"/>
  <rect x="4" y="7" width="8" height="1" fill="#6abe30"/>
  <rect x="6" y="5" width="1" height="2" fill="#6abe30"/>
  <rect x="5" y="5" width="1" height="1" fill="#99e550"/>
  <rect x="7" y="5" width="1" height="1" fill="#99e550"/>
  <rect x="9" y="4" width="2" height="1" fill="#ffffff"/>
  <!-- d-pad -->
  <rect x="4" y="11" width="1" height="3" fill="#2b2a3d"/>
  <rect x="3" y="12" width="3" height="1" fill="#2b2a3d"/>
  <!-- A/B buttons -->
  <rect x="11" y="11" width="2" height="2" fill="#e8534a"/>
  <rect x="9" y="13" width="2" height="2" fill="#e8534a"/>
  <!-- start/select -->
  <rect x="5" y="16" width="2" height="1" fill="#8d8aa6"/>
  <rect x="9" y="16" width="2" height="1" fill="#8d8aa6"/>
</svg>
